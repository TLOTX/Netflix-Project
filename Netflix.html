<!DOCTYPE html>
<html>
    <head>
        <title>Netflix</title>
        <link rel="stylesheet" href="NetflixCSS.css">
    </head>
    <body>
        <div id="background">
            <div id="backgroundimg">
                <img src="./NetflixNG_background.jpg" alt="Netflix background">
            </div>
            <div id="overlay"></div>
            <div id="content">
                <div id="logo">
                    <img src="./Netflix_Logo_PMS.png" alt="Netflix logo" width="100px" height="40px">
                </div>
                <div id="login">
                    <form action="">
                        <button type="submit" id="login-button"><h4>Sign In</h4></button>
                    </form>    
                </div>
                <div id="text">
                    <h1>Unlimited movies, TV shows and more</h1>
                    <h4>Starts at ₦2,500. Cancel anytime.</h4> <br>
                    <h4>Ready to Watch? Enter your email to create or restart your membership</h4>
                    <div id="register">
                        <form action="">
                            <input type="email" id="user-email" placeholder="Email address">
                            <button type="submit" id="registerbutton"><h4>Get Started ></h4></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
